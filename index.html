<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тут было • Память и Род</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {
      --bg-cream: #F4EBE1;
      --green-dark: #2D4436;
      --brown-dark: #3E2723;
      --ochre: #C87D55;
      --card-bg: #FFFFFF;
      --border-color: #D7C9BA;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
      background-color: var(--bg-cream);
      color: var(--brown-dark);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background-color: var(--green-dark);
      color: var(--bg-cream);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid var(--ochre);
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.2rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 55px);
    }

    /* Левая боковая панель */
    .sidebar {
      width: 420px;
      min-width: 320px;
      max-width: 480px;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      background: var(--bg-cream);
      z-index: 10;
    }

    .tree-nav {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .tree-nav h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--green-dark);
      margin-bottom: 10px;
    }

    .person-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .person-tab-btn {
      background: #E8DCCF;
      border: 1px solid var(--border-color);
      color: var(--brown-dark);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .person-tab-btn.active {
      background: var(--green-dark);
      color: var(--bg-cream);
      border-color: var(--green-dark);
    }

    .person-details {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }

    .person-header {
      margin-bottom: 20px;
    }

    .person-header h2 {
      color: var(--green-dark);
      font-size: 1.4rem;
      line-height: 1.2;
    }

    .person-header .years {
      color: var(--ochre);
      font-weight: 700;
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .places-section h3 {
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--green-dark);
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-add-place {
      background-color: var(--ochre);
      color: #fff;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .place-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--ochre);
      border-radius: 6px;
      padding: 14px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .place-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(62, 39, 35, 0.08);
    }

    .place-type {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--green-dark);
      margin-bottom: 4px;
    }

    .place-name {
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 2px;
      color: var(--brown-dark);
    }

    .place-years {
      font-size: 0.8rem;
      color: #7A6858;
      margin-bottom: 8px;
    }

    .place-desc {
      font-size: 0.85rem;
      line-height: 1.45;
      color: #4A3B32;
    }

    /* Правая панель: Карта */
    .map-container {
      flex: 1;
      height: 100%;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #EAE3D9;
    }
  </style>
</head>
<body>

  <header>
    <h1>Тут было • Память и Род</h1>
    <span style="font-size: 0.85rem; opacity: 0.9;">Геопривязка родовых мест</span>
  </header>

  <div class="main-container">
    <!-- Левая колонка -->
    <aside class="sidebar">
      <div class="tree-nav">
        <h2>Поколения рода</h2>
        <div class="person-tabs" id="personTabs"></div>
      </div>

      <div class="person-details" id="personDetails"></div>
    </aside>

    <!-- Карта -->
    <main class="map-container">
      <div id="map"></div>
    </main>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const familyData = [
      {
        id: "person-1",
        name: "Петр Степанович Ильичёв",
        years: "1906 — 1941",
        relation: "Прадед",
        places: [
          {
            title: "Родовой очаг и усадьба",
            type: "Родной дом",
            years: "1906 — 1941",
            lat: 53.4900,
            lng: 47.9500,
            city: "с. Красная Поляна",
            description: "Земля и изба, откуда уходил на фронт. 40 соток земли, хозяйство."
          },
          {
            title: "Мурманский рубеж (Заполярье)",
            type: "Место памяти",
            years: "Сентябрь 1941",
            lat: 69.1800,
            lng: 31.9500,
            city: "р. Западная Лица",
            description: "Рубеж обороны 112 стрелкового полка 52 сд. Точка воинской памяти."
          }
        ]
      },
      {
        id: "person-2",
        name: "Михаил Захарович Мальков",
        years: "1865 — 1930-е",
        relation: "Прапрадед",
        places: [
          {
            title: "Вятский исток",
            type: "Место рождения",
            years: "1865",
            lat: 57.3000,
            lng: 48.9000,
            city: "Кукарская волость (Яранский уезд)",
            description: "Земля мастеровых предков до переселения на заводы."
          },
          {
            title: "Золотые прииски и промыслы",
            type: "Место труда",
            years: "1890-е — 1910-е",
            lat: 54.3700,
            lng: 60.8100,
            city: "пос. Пласт (Южный Урал)",
            description: "Работа механиком на золотых приисках после перехода с Вятки."
          }
        ]
      }
    ];

    const map = L.map('map').setView([55.0, 50.0], 5);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let activeMarkers = [];

    const tabsContainer = document.getElementById('personTabs');
    const detailsContainer = document.getElementById('personDetails');

    function renderTabs() {
      tabsContainer.innerHTML = '';
      familyData.forEach((person, index) => {
        const btn = document.createElement('button');
        btn.className = `person-tab-btn ${index === 0 ? 'active' : ''}`;
        btn.textContent = person.name.split(' ')[0] + ' ' + person.name.split(' ')[1][0] + '.';
        btn.onclick = () => selectPerson(person.id);
        tabsContainer.appendChild(btn);
      });
    }

    function selectPerson(personId) {
      document.querySelectorAll('.person-tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', familyData[idx].id === personId);
      });

      const person = familyData.find(p => p.id === personId);
      if (!person) return;

      const placesHtml = person.places.map((place, idx) => `
        <div class="place-card" onclick="zoomToPlace(${idx})">
          <div class="place-type">${place.type} • ${place.city}</div>
          <div class="place-name">${place.title}</div>
          <div class="place-years">${place.years}</div>
          <div class="place-desc">${place.description}</div>
        </div>
      `).join('');

      detailsContainer.innerHTML = `
        <div class="person-header">
          <h2>${person.name}</h2>
          <div class="years">${person.years} (${person.relation})</div>
        </div>
        <div class="places-section">
          <h3>
            Культовые места 
            <button class="btn-add-place" onclick="alert('Форма добавления новой точки будет подключена на следующем этапе.')">+ Точка</button>
          </h3>
          ${placesHtml}
        </div>
      `;

      activeMarkers.forEach(m => map.removeLayer(m));
      activeMarkers = [];

      const bounds = [];
      person.places.forEach((place) => {
        const marker = L.circleMarker([place.lat, place.lng], {
          radius: 8,
          fillColor: '#C87D55',
          color: '#2D4436',
          weight: 2,
          opacity: 1,
          fillOpacity: 0.95
        }).addTo(map);

        marker.bindPopup(`<b>${place.title}</b><br>${place.type}<br><i>${place.years}</i>`);
        activeMarkers.push(marker);
        bounds.push([place.lat, place.lng]);
      });

      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [60, 60], maxZoom: 9 });
      }
    }

    window.zoomToPlace = function(index) {
      const marker = activeMarkers[index];
      if (marker) {
        map.setView(marker.getLatLng(), 11, { animate: true });
        marker.openPopup();
      }
    };

    renderTabs();
    selectPerson(familyData[0].id);
  </script>
</body>
</html>
